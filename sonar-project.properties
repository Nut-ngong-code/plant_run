# SonarCloud — https://sonarcloud.io/project/overview?id=Nut-ngong-code_plant_run
# สแกนผ่าน GitHub Actions (.github/workflows/ci.yml) — ต้องปิด Automatic Analysis ในหน้า SonarCloud
sonar.organization=nut-ngong-code
sonar.projectKey=Nut-ngong-code_plant_run
sonar.projectName=plant_run

# โค้ดที่สแกน: เว็บ (frontend) + API/MQTT (backend) · firmware เป็น C++ ของ Arduino ไม่ได้สแกน
sonar.sources=backend/src,frontend/src
sonar.tests=backend/test
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**
sonar.sourceEncoding=UTF-8

# coverage มาจากเทสของ backend (vitest) — frontend ยังไม่มีเทสอัตโนมัติ จึงไม่นับใน coverage
# (ยังสแกนหาบั๊ก/ช่องโหว่ใน frontend ตามปกติ)
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info
sonar.coverage.exclusions=frontend/**
