# Override สำหรับ Raspberry Pi 3 B+ (RAM 1 GB) — ใช้คู่กับ docker-compose.yml
#
#   docker compose -f docker-compose.yml -f docker-compose.pi.yml up -d
#
# ค่า default ของ MySQL 8 ตั้งมาสำหรับเครื่องที่มี RAM หลาย GB ถ้าปล่อยไว้บน Pi
# จะกินจนเหลือไม่พอให้ Node + OS แล้วโดน OOM killer เก็บ ไฟล์นี้รัดลงให้อยู่ราว ๆ 250-300 MB
services:
  db:
    # เก็บไฟล์ฐานข้อมูลบน SSD ภายนอก ไม่ใช่ SD card — MySQL เขียนบ่อยจน SD พังได้ และ SSD เร็วกว่ามาก
    # ต้อง mount SSD ไว้ที่ /mnt/ssd ก่อน (ดู pi-setup.md ขั้นที่ 3) ไม่งั้น Docker จะสร้างโฟลเดอร์เปล่าบน SD ให้แทน
    volumes:
      - /mnt/ssd/mysql-data:/var/lib/mysql
    command:
      - --innodb-buffer-pool-size=64M    # default 128M — โหลดงานเราเบามาก (sensor 5 นาที/ครั้ง)
      - --innodb-log-buffer-size=4M
      - --performance-schema=OFF         # ประหยัดได้เยอะสุดในบรรดา flag ทั้งหมด (~100-150M)
      - --max-connections=30             # default 151 — เรามี backend ตัวเดียว
      - --key-buffer-size=8M
      - --tmp-table-size=8M
      - --max-heap-table-size=8M
      - --table-open-cache=64
    mem_limit: 512m                      # เพดานแข็ง — ถ้าเกินให้ MySQL ตายตัวเดียว ไม่ลาก OS ไปด้วย
    healthcheck:                         # ให้ systemd/สคริปต์รู้ว่า DB พร้อมรับ connection จริงหรือยัง
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "plant_dev", "-pdevpassword123"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s                  # Pi 3 + SD card บูต MySQL ครั้งแรกช้า เผื่อไว้เยอะหน่อย
